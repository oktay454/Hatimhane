[package]
name = "hatimhane"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "Çoklu cami ve hatim grubu yönetimi"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
constant_time_eq = "0.3"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "any", "sqlite", "mysql", "postgres"] }
tokio = { version = "1", features = ["full"] }
toml = "0.9"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
