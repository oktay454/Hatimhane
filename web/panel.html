<!doctype html>
<html lang="tr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>Hatimhane</title>
	<link rel="stylesheet" href="/assets/style.css">
	<script src="/assets/theme.js"></script>
	<meta name="robots" content="noindex, nofollow">
	<script src="/assets/panel.js" defer></script>
</head>
<body>
	<a class="atla" href="#icerik">İçeriğe geç</a>
	<header class="ust"><div class="ust-icerik">
		<a class="marka" href="/">Hatimhane</a>
		<div class="tema-alani">
			<button id="tema-dugmesi" class="tema-dugmesi" type="button"><span id="tema-etiketi">Koyu görünüm</span></button>
			<button id="otomatik-tema" class="otomatik-tema" type="button" hidden>Cihaz ayarına dön</button>
		</div>
	</div></header>
	<main id="icerik" class="sayfa panel-sayfa">
		<section class="giris"><p id="cami-adi" class="cami-adi" hidden></p><h1 id="baslik">Yönetim paneli</h1></section>
		<div id="durum" class="panel-durum" role="status" aria-live="polite">Yükleniyor…</div>
		<nav id="oturum-nav" class="oturum-nav" hidden><button id="camilerim" type="button">Camilerim</button><button id="hesabim" type="button">Hesabım</button><button id="kullanicilar" type="button" hidden>Sunucu yönetimi</button><button id="cikis" type="button">Çıkış yap</button></nav>
		<section id="gorunum"></section>
		<noscript><p class="panel-durum">Yönetim paneli için JavaScript’i etkinleştirin.</p></noscript>
	</main>
</body>
</html>
